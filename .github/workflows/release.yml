name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Run release checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release and container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a tag like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Require tag commit on main or master
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in main master; do
            ref="refs/remotes/origin/$branch"
            if git show-ref --verify --quiet "$ref" && git merge-base --is-ancestor "$TAG_COMMIT" "$ref"; then
              echo "Tag commit is reachable from $branch"
              exit 0
            fi
          done
          echo "Release tags must point to a commit on main or master" >&2
          exit 1

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish container image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="${IMAGE,,}"
          docker build -t "$image:$RELEASE_TAG" .
          docker push "$image:$RELEASE_TAG"
          if [[ "$RELEASE_TAG" != *-* ]]; then
            docker tag "$image:$RELEASE_TAG" "$image:latest"
            docker push "$image:latest"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_args=(--verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_args[@]}"
          else
            echo "GitHub release $RELEASE_TAG already exists"
          fi
